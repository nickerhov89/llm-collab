<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cowork — команда</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#252629;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:880px;margin:64px auto;padding:0 24px}header{border-bottom:1px solid #dddde1;padding-bottom:24px;margin-bottom:32px;display:flex;align-items:baseline;justify-content:space-between;gap:16px}h1{font-size:28px;letter-spacing:-1px;margin:0}h2{font-size:20px;margin:0 0 12px}p{color:#666970}section{background:white;border:1px solid #dddde1;border-radius:12px;padding:28px;margin:20px 0}.login{max-width:440px}label{display:block;margin:16px 0 6px;font-weight:600}input{width:100%;font:inherit;padding:12px;border:1px solid #c6c7cc;border-radius:7px;background:white}button,a.button{font:inherit;border:1px solid #c6c7cc;border-radius:7px;padding:11px 16px;background:white;color:#252629;cursor:pointer;text-decoration:none;display:inline-block;min-height:46px}button.primary{background:#252629;color:white;border-color:#252629;width:100%;margin-top:22px}button:disabled{opacity:.6;cursor:wait}a{color:inherit}small{color:#666970}#notice{min-height:24px;color:#8d2929}.actions{display:flex;gap:10px;flex-wrap:wrap}.card{padding:20px 0;border-top:1px solid #e5e5e8}.card strong{font-size:18px}.card p{margin:6px 0 14px}.card input{max-width:280px}.muted{font-size:14px;color:#777}.hidden{display:none}@media(max-width:550px){main{margin:28px auto;padding:0 16px}header{display:block}header a{display:block;margin-top:10px}section{padding:20px}.actions>*{flex:1 1 100%}.card input{max-width:none}}
</style>
<main><header><h1>Cowork <span style="color:#8d8f96;font-weight:400">/ команда</span></h1><div><button id="switch" class="hidden">Другой пользователь</button> <a href="/">Мой Cowork →</a></div></header>
<section class="login"><h2>Войти в свой кабинет</h2><p>У каждого — свои чаты, проекты, задачи и файлы.</p><form id="login"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" placeholder="marker, ceo, cfo, cto или owner"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary" id="submit">Войти</button></form><p class="muted">Для владельца: owner или пустой логин. Пароли сотрудников прежние.</p></section>
<p id="notice" role="status" aria-live="polite"></p>
<section id="admin" class="hidden"><h2>Сотрудники</h2><p>Управление доступно только владельцу. Открытие кабинета ниже выполняется с правами администратора.</p><div id="accounts"></div></section>
</main><script>
const notice=document.getElementById('notice');
async function request(path,data){const r=await fetch('/team/api/'+path,{method:data===undefined?'GET':'POST',headers:data===undefined?{}:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const json=await r.json();if(!r.ok)throw Error(json.error||'Не удалось выполнить действие');return json}
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;notice.textContent='Проверяем вход…';try{const data=await request('login',{username:document.getElementById('username').value,password:document.getElementById('password').value});document.getElementById('password').value='';location.assign(data.next)}catch(e){notice.textContent=e.message;b.disabled=false}});
document.getElementById('switch').onclick=()=>{document.querySelector('section.login').classList.remove('hidden');document.getElementById('username').focus();scrollTo(0,0)};
async function load(){try{const data=await request('accounts');document.querySelector('section.login').classList.add('hidden');document.getElementById('switch').classList.remove('hidden');document.getElementById('admin').classList.remove('hidden');const list=document.getElementById('accounts');list.replaceChildren();for(const a of data.accounts){const card=document.createElement('div');card.className='card';const title=document.createElement('strong');title.textContent=a.label+' · '+a.username;card.append(title);const status=document.createElement('p');status.textContent=!a.online?'Сервис недоступен':a.disabled?'Вход отключён':'Вход включён · проектов: '+a.projects;card.append(status);if(a.online){const actions=document.createElement('div');actions.className='actions';for(const [text,action] of [['Открыть кабинет','open'],[a.disabled?'Включить вход':'Отключить вход',a.disabled?'enable':'disable']]){const b=document.createElement('button');b.textContent=text;b.onclick=async()=>{b.disabled=true;try{const result=await request('accounts/'+a.username+'/'+action,{});if(result.next)location.assign(result.next);else{notice.textContent='Доступ обновлён';await load()}}catch(e){notice.textContent=e.message;b.disabled=false}};actions.append(b)}card.append(actions);const form=document.createElement('form');form.className='actions';form.style.marginTop='14px';const input=document.createElement('input');input.type='password';input.placeholder='Новый пароль, от 12 символов';input.autocomplete='new-password';input.minLength=12;input.required=true;input.setAttribute('aria-label','Новый пароль '+a.username);const save=document.createElement('button');save.textContent='Сменить пароль';form.append(input,save);form.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{await request('accounts/'+a.username+'/password',{password:input.value});input.value='';notice.textContent='Пароль изменён, прежние входы завершены'}catch(e){notice.textContent=e.message}finally{save.disabled=false}};card.append(form)}list.append(card)}}catch{/* Ordinary login page: no owner credential. */}}
load();
</script></html>
