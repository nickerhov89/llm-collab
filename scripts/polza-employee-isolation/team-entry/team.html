<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cowork — команда</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f8;color:#252629;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:880px;margin:64px auto;padding:0 24px}header{border-bottom:1px solid #dddde1;padding-bottom:24px;margin-bottom:32px;display:flex;align-items:baseline;justify-content:space-between;gap:16px}h1{font-size:28px;letter-spacing:-1px;margin:0}h2{font-size:20px;margin:0 0 12px}p{color:#666970}section{background:white;border:1px solid #dddde1;border-radius:12px;padding:28px;margin:20px 0}.login{max-width:440px}label{display:block;margin:16px 0 6px;font-weight:600}input{width:100%;font:inherit;padding:12px;border:1px solid #c6c7cc;border-radius:7px;background:white}button,a.button{font:inherit;border:1px solid #c6c7cc;border-radius:7px;padding:11px 16px;background:white;color:#252629;cursor:pointer;text-decoration:none;display:inline-block;min-height:46px}button.primary{background:#252629;color:white;border-color:#252629;width:100%;margin-top:22px}button:disabled{opacity:.6;cursor:wait}a{color:inherit}small{color:#666970}#notice{min-height:24px;color:#8d2929}.actions{display:flex;gap:10px;flex-wrap:wrap}.card{padding:20px 0;border-top:1px solid #e5e5e8}.card strong{font-size:18px}.card p{margin:6px 0 14px}.card input{max-width:280px}.muted{font-size:14px;color:#777}.hidden{display:none}@media(max-width:550px){main{margin:28px auto;padding:0 16px}header{display:block}header a{display:block;margin-top:10px}section{padding:20px}.actions>*{flex:1 1 100%}.card input{max-width:none}}
.rights{margin-top:20px;padding:18px;background:#f7f7f8;border:1px solid #dddde1;border-radius:9px}.rights h3{font-size:17px;margin:4px 0 8px}.rights p{font-size:14px;margin:4px 0 12px}.permission{display:grid;grid-template-columns:minmax(0,1fr) 195px;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid #dddde1}.permission label{margin:0;font-size:15px}.permission small{display:block;font-weight:400;margin-top:3px}.permission select{width:100%;padding:10px 8px;font:inherit;font-size:14px;min-height:44px;border:1px solid #bfc0c5;border-radius:6px;background:#fff;color:#252629}.rights button{margin:14px 0 12px}.rights .feedback{min-height:24px;font-size:14px}.rights fieldset{border:0;margin:0 0 18px;padding:0;min-width:0}.rights legend{font-size:17px;font-weight:600;margin-bottom:8px}.rights button.primary{width:auto;margin-top:14px}.rights [aria-busy=true]{opacity:.7}@media(max-width:550px){.permission{grid-template-columns:minmax(0,1fr);gap:8px}.rights{padding:14px}.rights button{width:100%}}
</style>
<main><header><h1>Cowork <span style="color:#8d8f96;font-weight:400">/ команда</span></h1><div><button id="switch" class="hidden">Другой пользователь</button> <a href="/">Мой Cowork →</a></div></header>
<section class="login"><h2>Войти в свой кабинет</h2><p>У каждого — свои чаты, проекты, задачи и файлы.</p><form id="login"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" placeholder="marker, ceo, cfo, cto или owner"><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="primary" id="submit">Войти</button></form><p class="muted">Для владельца: owner или пустой логин. Пароли сотрудников прежние.</p></section>
<p id="notice" role="status" aria-live="polite"></p>
<section id="admin" class="hidden"><h2>Сотрудники</h2><p>Управление доступно только владельцу. Открытие кабинета ниже выполняется с правами администратора.</p><div id="accounts"></div></section>
</main><script>
const notice=document.getElementById('notice');
let permissionId=0;
function permissionRow(label, note, value, choices) {
 const row=document.createElement('div');row.className='permission';
 const text=document.createElement('label');text.textContent=label;
 const select=document.createElement('select');select.setAttribute('aria-label',label);select.id='permission-'+(++permissionId);text.htmlFor=select.id;
 if(note){const small=document.createElement('small');small.textContent=note;text.append(small)}
 for(const [id,title] of choices){const option=document.createElement('option');option.value=id;option.textContent=title;select.append(option)}
 select.value=value;row.append(text,select);return {row,select};
}
async function showAccess(account, card, trigger) {
 const existing=card.querySelector('.rights');if(existing){existing.remove();trigger.setAttribute('aria-expanded','false');return}
 trigger.disabled=true;const panel=document.createElement('div');panel.className='rights';card.append(panel);
 try{
  const data=await request('accounts/'+account.username+'/access');
  const heading=document.createElement('h3');heading.textContent='Доступы · '+account.username;panel.append(heading);
  const note=document.createElement('p');note.textContent='Права на проекты и интеграции сохраняются отдельно. Доступ не подтверждает, что вход на внешней площадке ещё действует.';panel.append(note);
  for(const kind of ['projects','integrations']){
   const form=document.createElement('form');const field=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent=kind==='projects'?'Проекты':'Интеграции';field.append(legend);
   const rows=[];
   for(const item of data[kind]){
    const choices=kind==='projects'?[['none','Нет доступа'],['view','Просмотр'],['join','Продолжать чаты'],['work','Работа с проектом']]:[['none','Нет доступа'],['read','Чтение'],...(item.write?[['write','Чтение и действия']]:[])];
    const {row,select}=permissionRow(item.name||item.label,kind==='integrations'?item.note:null,item.mode,choices);
    if(kind==='integrations'&&!item.configured){select.disabled=true;select.value='none'}
    rows.push({item,select});field.append(row);
   }
   if(!rows.length){const empty=document.createElement('p');empty.textContent=kind==='projects'?'Проектов пока нет':'Сервис интеграций не подключён';field.append(empty)}
   const save=document.createElement('button');save.type='submit';save.textContent=kind==='projects'?'Сохранить проекты':'Сохранить интеграции';save.disabled=!rows.length;
   const feedback=document.createElement('p');feedback.className='feedback';feedback.setAttribute('role','status');feedback.setAttribute('aria-live','polite');
   form.append(field,save,feedback);panel.append(form);
   form.onsubmit=async e=>{e.preventDefault();save.disabled=true;field.disabled=true;feedback.textContent='Сохраняем…';
    try{
     const payload=kind==='projects'?{projects:rows.map(({item,select})=>({id:item.id,mode:select.value}))}:{integrations:Object.fromEntries(rows.map(({item,select})=>[item.id,select.value])),revision:data.integrationRevision};
     await request('accounts/'+account.username+'/'+kind,payload);
     if(kind==='integrations'){const fresh=await request('accounts/'+account.username+'/access');data.integrationRevision=fresh.integrationRevision}
     feedback.textContent='Сохранено. Новые обращения проверяют актуальные права.';
    }catch(error){feedback.textContent=error.message}finally{save.disabled=false;field.disabled=false;for(const {item,select} of rows)if(kind==='integrations'&&!item.configured)select.disabled=true}
   };
  }
  const limits=document.createElement('p');limits.className='muted';limits.textContent='Права проектов ограничивают кабинет и действия в чатах. Файлы в собственной рабочей папке агента этим переключателем не блокируются. Действия, начатые во внешнем сервисе до отзыва, могут завершиться.';panel.append(limits);
  trigger.setAttribute('aria-expanded','true');heading.tabIndex=-1;heading.focus({preventScroll:true});panel.scrollIntoView({block:'start'});
 }catch(error){panel.textContent=error.message}finally{trigger.disabled=false}
}

async function request(path,data){const r=await fetch('/team/api/'+path,{method:data===undefined?'GET':'POST',headers:data===undefined?{}:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const json=await r.json();if(!r.ok)throw Error(json.error||'Не удалось выполнить действие');return json}
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit');b.disabled=true;notice.textContent='Проверяем вход…';try{const data=await request('login',{username:document.getElementById('username').value,password:document.getElementById('password').value});document.getElementById('password').value='';location.assign(data.next)}catch(e){notice.textContent=e.message;b.disabled=false}});
document.getElementById('switch').onclick=()=>{document.querySelector('section.login').classList.remove('hidden');document.getElementById('username').focus();scrollTo(0,0)};
async function load(){try{const data=await request('accounts');document.querySelector('section.login').classList.add('hidden');document.getElementById('switch').classList.remove('hidden');document.getElementById('admin').classList.remove('hidden');const list=document.getElementById('accounts');list.replaceChildren();for(const a of data.accounts){const card=document.createElement('div');card.className='card';const title=document.createElement('strong');title.textContent=a.label+' · '+a.username;card.append(title);const status=document.createElement('p');status.textContent=!a.online?'Сервис недоступен':a.disabled?'Вход отключён':'Вход включён · проектов: '+a.projects;card.append(status);if(a.online){const actions=document.createElement('div');actions.className='actions';const rights=document.createElement('button');rights.textContent='Проекты и интеграции';rights.setAttribute('aria-expanded','false');rights.onclick=()=>showAccess(a,card,rights);actions.append(rights);for(const [text,action] of [['Открыть кабинет','open'],[a.disabled?'Включить вход':'Отключить вход',a.disabled?'enable':'disable']]){const b=document.createElement('button');b.textContent=text;b.onclick=async()=>{b.disabled=true;try{const result=await request('accounts/'+a.username+'/'+action,{});if(result.next)location.assign(result.next);else{notice.textContent='Доступ обновлён';await load()}}catch(e){notice.textContent=e.message;b.disabled=false}};actions.append(b)}card.append(actions);const form=document.createElement('form');form.className='actions';form.style.marginTop='14px';const input=document.createElement('input');input.type='password';input.placeholder='Новый пароль, от 12 символов';input.autocomplete='new-password';input.minLength=12;input.required=true;input.setAttribute('aria-label','Новый пароль '+a.username);const save=document.createElement('button');save.textContent='Сменить пароль';form.append(input,save);form.onsubmit=async e=>{e.preventDefault();save.disabled=true;try{await request('accounts/'+a.username+'/password',{password:input.value});input.value='';notice.textContent='Пароль изменён, прежние входы завершены'}catch(e){notice.textContent=e.message}finally{save.disabled=false}};card.append(form)}list.append(card)}}catch{/* Ordinary login page: no owner credential. */}}
load();
</script></html>
